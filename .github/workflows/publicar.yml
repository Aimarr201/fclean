name: Publicar fclean

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: publicar-fclean-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pruebas:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          persist-credentials: false

      - name: Guardar la revisión de dev
        id: revision
        run: |
          revision=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Ejecutar las pruebas
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh rsync desktop-file-utils python3-venv
          bash -n fclean
          python3 -B -W error -m unittest discover -s tests

  publicar:
    needs: pruebas
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Publicar los archivos probados
        env:
          REVISION: ${{ needs.pruebas.outputs.revision }}
        run: |
          git restore --source="$REVISION" --staged --worktree -- fclean README.md .gitattributes
          if git diff --cached --quiet; then
            printf 'main ya contiene la versión probada.\n'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publicar fclean desde $REVISION"
          git push origin HEAD:refs/heads/main
